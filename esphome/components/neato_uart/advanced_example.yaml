# Advanced ESPHome configuration for Neato vacuum with full feature parity
# This example shows how to replicate all features from the original lambda-based config

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

esphome:
  name: neato-vacuum
  project:
    name: philip2809.neato-connected
    version: "2.0.0"

  on_boot:
    - priority: 600
      then:
        - text_sensor.template.publish:
            id: ui_state
            state: "Starting..."

    - priority: -100
      then:
        - logger.log: "Device booted successfully"
        # You can add additional startup logic here

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

# Enable OTA updates
ota:
  - platform: esphome

# Time component - required for cleaning session tracking
time:
  - platform: homeassistant
    id: homeassistant_time

# UART configuration
uart:
  id: uart_bus
  baud_rate: 115200
  tx_pin: GPIO16
  rx_pin: GPIO17
  rx_buffer_size: 4096

# The Neato UART component with time integration
neato_uart:
  id: neato_device
  uart_id: uart_bus
  time_id: homeassistant_time

# Periodic update intervals (replace scripts from original config)
interval:
  - interval: 2s
    then:
      - neato_uart.send_command:
          id: neato_device
          command: "GetErr"
      - neato_uart.send_command:
          id: neato_device
          command: "GetState"

  - interval: 2min
    then:
      - neato_uart.send_command:
          id: neato_device
          command: "GetCharger"

# All numeric sensors
sensor:
  - platform: neato_uart
    neato_uart_id: neato_device
    fuel_percent:
      name: "Battery Level"
      id: battery_level
    battery_temp:
      name: "Battery Temperature"
    battery_voltage:
      name: "Battery Voltage"
    external_voltage:
      name: "Charger Voltage"
    charger_mah:
      name: "Charge mAh"
    discharge_mah:
      name: "Discharge mAh"
    battery_cycles:
      name: "Battery Cycles"
    filter_change_time:
      name: "Filter Change Time"
    brush_change_time:
      name: "Brush Change Time"
    dirt_bin_alert:
      name: "Dirt Bin Alert Reminder"
    current_dirt_bin_runtime:
      name: "Current Dirt Bin Runtime"
    number_dust_bin_full:
      name: "Number of Full Dust Bin Cleanings"
    last_cleaning_duration:
      name: "Last Cleaning Duration"

# All binary sensors for status flags
binary_sensor:
  - platform: neato_uart
    neato_uart_id: neato_device
    usb_connected:
      name: "USB Connected"
    battery_over_temp:
      name: "Battery Over Temperature"
    charging_active:
      name: "Charging Active"
    charging_enabled:
      name: "Charging Enabled"
    confident_on_fuel:
      name: "Confident On Fuel"
    on_reserved_fuel:
      name: "On Reserved Fuel"
    empty_fuel:
      name: "Empty Fuel"
    battery_failure:
      name: "Battery Failure"
    ext_power_present:
      name: "External Power Present"
    thermistor_present:
      name: "Thermistor Present"

# All text sensors for status information
text_sensor:
  - platform: neato_uart
    neato_uart_id: neato_device
    robot_error:
      name: "Robot Error"
    robot_alert:
      name: "Robot Alert"
    ui_state:
      name: "UI State"
      id: ui_state
    robot_state:
      name: "Robot State"
    robot_model:
      name: "Model"
    robot_serial:
      name: "Serial Number"
    mainboard_version:
      name: "Mainboard Version"
    mainboard_serial:
      name: "Mainboard Serial"
    language:
      name: "Language"
    last_cleaning_time:
      name: "Last Cleaning Time"
    last_cleaning_type:
      name: "Last Cleaning Type"

# Control buttons
button:
  - platform: template
    name: "House Clean"
    icon: mdi:home
    on_press:
      - neato_uart.send_command:
          id: neato_device
          command: "Clean"

  - platform: template
    name: "Spot Clean"
    icon: mdi:target
    on_press:
      - neato_uart.send_command:
          id: neato_device
          command: "Clean Spot"

  - platform: template
    name: "Stop Cleaning"
    icon: mdi:stop
    on_press:
      - neato_uart.send_command:
          id: neato_device
          command: "Clean Stop"

  - platform: template
    name: "Pause Cleaning"
    icon: mdi:pause
    on_press:
      - neato_uart.send_command:
          id: neato_device
          command: "Clean Stop"

  - platform: template
    name: "Resume Cleaning"
    icon: mdi:play
    on_press:
      - neato_uart.send_command:
          id: neato_device
          command: "Clean"

  - platform: template
    name: "Locate Robot"
    icon: mdi:volume-high
    on_press:
      - neato_uart.play_sound:
          id: neato_device
          sound_id: 20

  - platform: template
    name: "Update Status"
    icon: mdi:refresh
    on_press:
      - neato_uart.send_command:
          id: neato_device
          command: "GetErr"
      - delay: 50ms
      - neato_uart.send_command:
          id: neato_device
          command: "GetState"
      - delay: 50ms
      - neato_uart.send_command:
          id: neato_device
          command: "GetCharger"
      - delay: 50ms
      - neato_uart.send_command:
          id: neato_device
          command: "GetVersion"
      - delay: 50ms
      - neato_uart.send_command:
          id: neato_device
          command: "GetUserSettings"

  - platform: template
    name: "Shutdown"
    icon: mdi:power
    on_press:
      - neato_uart.send_command:
          id: neato_device
          command: "TestMode On"
      - delay: 100ms
      - neato_uart.send_command:
          id: neato_device
          command: "SetSystemMode Shutdown"

  - platform: template
    name: "PowerCycle"
    icon: mdi:restart
    on_press:
      - neato_uart.send_command:
          id: neato_device
          command: "SetSystemMode PowerCycle"

  - platform: restart
    name: "Reboot ESP"

# Settings switches using UART commands
switch:
  - platform: template
    name: "Test Mode"
    id: test_mode
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "TestMode On"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "TestMode Off"
    entity_category: "diagnostic"

  - platform: template
    name: "Click Sounds"
    optimistic: true
    id: click_sounds
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings ButtonClick ON"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings ButtonClick OFF"
    entity_category: "diagnostic"

  - platform: template
    name: "LED"
    optimistic: true
    id: led
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings StealthLED ON"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings StealthLED OFF"
    entity_category: "diagnostic"

  - platform: template
    name: "Wall Enable"
    optimistic: true
    id: wall_enable
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings WallEnable ON"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings WallEnable OFF"
    entity_category: "diagnostic"

  - platform: template
    name: "Eco Mode"
    optimistic: true
    id: eco_mode
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings EcoMode ON"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings EcoMode OFF"
    entity_category: "diagnostic"

  - platform: template
    name: "Intense Clean"
    optimistic: true
    id: intense_clean
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings IntenseClean ON"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings IntenseClean OFF"
    entity_category: "diagnostic"

  - platform: template
    name: "WiFi"
    optimistic: true
    id: wifi_state
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings WiFi ON"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings WiFi OFF"
    entity_category: "diagnostic"

  - platform: template
    name: "Melody Sounds"
    optimistic: true
    id: melody_sounds
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings Melodies ON"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings Melodies OFF"
    entity_category: "diagnostic"

  - platform: template
    name: "Warning Sounds"
    optimistic: true
    id: warning_sounds
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings Warnings ON"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings Warnings OFF"
    entity_category: "diagnostic"

  - platform: template
    name: "Bin Full Detect"
    optimistic: true
    id: bin_full_detect
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings BinFullDetect ON"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings BinFullDetect OFF"
    entity_category: "diagnostic"

  - platform: template
    name: "Schedule"
    optimistic: true
    id: schedule_enabled
    turn_on_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings Schedule ON"
    turn_off_action:
      - neato_uart.send_command:
          id: neato_device
          command: "SetUserSettings Schedule OFF"
    entity_category: "diagnostic"

# Numeric inputs for custom parameters
number:
  - platform: template
    id: spot_width
    min_value: 100
    max_value: 400
    step: 1
    unit_of_measurement: "cm"
    mode: SLIDER
    name: "Spot Clean Width"
    optimistic: true

  - platform: template
    id: spot_height
    min_value: 100
    max_value: 400
    step: 1
    unit_of_measurement: "cm"
    mode: SLIDER
    name: "Spot Clean Height"
    optimistic: true

# Select for cleaning mode
select:
  - platform: template
    name: "Navigation Mode"
    id: navigation_mode
    optimistic: true
    options:
      - "Normal"
      - "Gentle"
      - "Deep"
      - "Quick"
    icon: "mdi:robot-vacuum"
    on_value:
      then:
        - neato_uart.send_command:
            id: neato_device
            command: !lambda |-
              return std::string("SetNavigationMode ") + x;
